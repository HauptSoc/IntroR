project:
  type: website
  output-dir: _site

website:
  title: "Einführung in R und Quarto"
  description: "Seminar-Website: Grundlagen von R und Quarto"
  site-url: https://introR.andreas-haupt.com
  favicon: favicon.ico
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: Home
      - text: Sitzungen
        menu:
          - href: sitzungen/index.qmd
            text: Übersicht
          - href: sitzungen/01-einfuehrung-r.qmd
            text: "01 – Einführung in R"
          - href: sitzungen/02-datenstrukturen.qmd
            text: "02 – Datenstrukturen"
          - href: sitzungen/03-datenimport-tidyverse.qmd
            text: "03 – Datenimport & tidyverse"
          - href: sitzungen/04-visualisierung.qmd
            text: "04 – Visualisierung"
          - href: sitzungen/05-quarto-berichte.qmd
            text: "05 – Quarto & Berichte"
          - href: sitzungen/06-abschlussprojekt.qmd
            text: "06 – Abschlussprojekt"
      - href: materialien.qmd
        text: Materialien
      - href: ueber.qmd
        text: Über das Seminar
    right:
      - icon: github
        href: https://github.com/
        aria-label: GitHub

  sidebar:
    style: docked
    contents:
      - section: "Sitzungen"
        contents:
          - sitzungen/index.qmd
          - sitzungen/01-einfuehrung-r.qmd
          - sitzungen/02-datenstrukturen.qmd
          - sitzungen/03-datenimport-tidyverse.qmd
          - sitzungen/04-visualisierung.qmd
          - sitzungen/05-quarto-berichte.qmd
          - sitzungen/06-abschlussprojekt.qmd

  page-footer:
    left: "© 2026 Andreas Haupt"

format:
  html:
    respect-user-color-scheme: true
    theme: 
      dark: [darkly, style/dracula.scss]
      light: [style/stat331.scss]
    header-includes: |
      <link rel="stylesheet" media="screen" href="https://fonts.googleapis.com/css2?family=Fira+Sans" type="text/css"/>
      <link rel="stylesheet" media="screen" href="https://fonts.googleapis.com/css2?family=Fira+Code" type="text/css"/>
    mainfont: "Fira Sans"
    monofont: "Fira Code"
highlight-style: Dracula

execute:
  freeze: auto
